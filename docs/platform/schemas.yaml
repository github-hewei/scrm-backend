schemas:
  CommonResponse:
    type: object
    properties:
      errcode:
        type: integer
        description: 错误码，0表示成功
        example: 0
      message:
        type: string
        description: 消息
        example: success
      data:
        type: object
        description: 响应数据

  DailyCount:
    type: object
    properties:
      date:
        type: string
        description: 日期(YYYY-MM-DD)
      count:
        type: integer
        description: 当日数量

  RbacMenuSyncNode:
    type: object
    required:
      - name
      - path
    properties:
      name:
        type: string
        description: 菜单名称(对应title)
      path:
        type: string
        description: 页面路径(全局唯一，作为身份标识)
      module_key:
        type: string
        description: 功能模块key
      sort:
        type: integer
        description: 排序
      children:
        type: array
        description: 子页面菜单
        items:
          $ref: '#/schemas/RbacMenuSyncNode'
      actions:
        type: array
        description: 操作菜单(可出现在任意层级)
        items:
          $ref: '#/schemas/RbacMenuActionSync'

  RbacMenuActionSync:
    type: object
    required:
      - name
      - action_mark
    properties:
      name:
        type: string
        description: 操作名称
      action_mark:
        type: string
        description: 操作标识(页面内唯一)

  PlatformLoginRequest:
    type: object
    required:
      - username
      - password
      - captcha_id
      - captcha_code
    properties:
      username:
        type: string
        description: 用户名
        example: admin
      password:
        type: string
        description: 密码
        example: "123456"
      captcha_id:
        type: string
        description: 验证码ID
      captcha_code:
        type: string
        description: 验证码点选坐标（JSON字符串）

  PlatformLoginResponse:
    type: object
    properties:
      errcode:
        type: integer
        example: 0
      message:
        type: string
        example: success
      data:
        type: object
        properties:
          token:
            type: string
            description: JWT令牌
          ttl:
            type: integer
            description: Token有效期（秒）
          user:
            $ref: '#/schemas/PlatformUser'

  PlatformUser:
    type: object
    properties:
      id:
        type: integer
        description: 用户ID
      username:
        type: string
        description: 用户名
      real_name:
        type: string
        description: 姓名
      avatar_id:
        type: integer
        description: 头像文件ID
      role:
        type: integer
        description: 角色 (0超管 1运营 2审计)
      status:
        type: integer
        description: 状态 (1启用 0禁用)
      last_login_time:
        type: integer
        description: 最后登录时间
      last_login_ip:
        type: string
        description: 最后登录IP
      created_at:
        type: integer
        description: 创建时间
      updated_at:
        type: integer
        description: 更新时间

  RbacStore:
    type: object
    properties:
      id:
        type: integer
        description: 企业ID
      name:
        type: string
        description: 企业名称
      short_name:
        type: string
        description: 企业简称
      contact:
        type: string
        description: 企业联系人
      contact_phone:
        type: string
        description: 联系电话
      description:
        type: string
        description: 简介
      logo_image_id:
        type: integer
        description: LOGO文件ID
      sort:
        type: integer
        description: 排序
      is_recycle:
        type: integer
        description: 是否回收 (0否 1是)
      created_at:
        type: integer
        description: 创建时间
      updated_at:
        type: integer
        description: 更新时间

  RbacUser:
    type: object
    properties:
      id:
        type: integer
        description: 用户ID
      username:
        type: string
        description: 用户名
      real_name:
        type: string
        description: 姓名
      is_super:
        type: integer
        description: 是否为超级管理员（1是 0否），由服务端按请求端侧自动确定，客户端无需传入
      sort:
        type: integer
        description: 排序
      store_id:
        type: integer
        description: 企业ID
      created_at:
        type: integer
        description: 创建时间
      updated_at:
        type: integer
        description: 更新时间
      rbac_user_role:
        type: array
        items:
          $ref: '#/schemas/RbacUserRole'
        description: 关联角色列表

  RbacUserRole:
    type: object
    properties:
      id:
        type: integer
        description: 关联ID
      user_id:
        type: integer
        description: 用户ID
      role_id:
        type: integer
        description: 角色ID
      store_id:
        type: integer
        description: 企业ID
      created_at:
        type: integer
        description: 创建时间
      rbac_role:
        $ref: '#/schemas/RbacRole'
        description: 角色信息

  ChangePasswordRequest:
    type: object
    required:
      - old_password
      - new_password
    properties:
      old_password:
        type: string
        description: 旧密码
      new_password:
        type: string
        description: 新密码
        minLength: 6
        maxLength: 20

  RbacMenu:
    type: object
    properties:
      id:
        type: integer
        description: 菜单ID
      type:
        type: integer
        description: 菜单类型 (10页面 20操作)
      name:
        type: string
        description: 菜单名称
      path:
        type: string
        description: 菜单路径
      is_page:
        type: integer
        description: 是否为页面 (1是 0否)
      module_key:
        type: string
        description: 功能模块key
      action_mark:
        type: string
        description: 操作标识
      parent_id:
        type: integer
        description: 上级菜单ID
      sort:
        type: integer
        description: 排序
      created_at:
        type: integer
        description: 创建时间
      updated_at:
        type: integer
        description: 更新时间
      children:
        type: array
        items:
          $ref: '#/schemas/RbacMenu'
        description: 子菜单
      actions:
        type: array
        items:
          $ref: '#/schemas/RbacMenu'
        description: 操作列表

  RbacApi:
    type: object
    properties:
      id:
        type: integer
        description: 接口ID
      name:
        type: string
        description: 接口名称
      url:
        type: string
        description: 接口URL
      parent_id:
        type: integer
        description: 父级ID
      sort:
        type: integer
        description: 排序
      created_at:
        type: integer
        description: 创建时间
      updated_at:
        type: integer
        description: 更新时间
      children:
        type: array
        items:
          $ref: '#/schemas/RbacApi'

  RbacRole:
    type: object
    properties:
      id:
        type: integer
        description: 角色ID
      role_name:
        type: string
        description: 角色名称
      parent_id:
        type: integer
        description: 父级角色ID
      sort:
        type: integer
        description: 排序
      is_super:
        type: integer
        description: 是否超管角色（1是 0否），由服务端按请求端侧自动确定，客户端无需传入
      store_id:
        type: integer
        description: 企业ID
      created_at:
        type: integer
        description: 创建时间
      updated_at:
        type: integer
        description: 更新时间

  SettingDefault:
    type: object
    properties:
      id:
        type: integer
        description: 设置ID
      setting_key:
        type: string
        description: 设置项标识
      setting_values:
        type: string
        description: 设置内容(JSON格式)
      description:
        type: string
        description: 设置项描述
      created_at:
        type: integer
        description: 创建时间
      updated_at:
        type: integer
        description: 更新时间

  CaptchaGenerateResponse:
    type: object
    properties:
      errcode:
        type: integer
      message:
        type: string
      data:
        type: object
        properties:
          captcha_id:
            type: string
            description: 验证码ID
          master_image:
            type: string
            description: 主图(base64)
          thumb_image:
            type: string
            description: 缩略图(base64)

  FormGroup:
    type: object
    properties:
      key:
        type: string
        description: 分组标识
      label:
        type: string
        description: 分组名称
      description:
        type: string
        description: 分组描述
      only_platform:
        type: boolean
        description: 是否仅平台可用
      fields:
        type: array
        items:
          $ref: '#/schemas/FormField'

  FormField:
    type: object
    properties:
      key:
        type: string
        description: 字段标识
      label:
        type: string
        description: 字段名称
      type:
        type: string
        description: 表单类型（text/textarea/select/checkbox/switch/image/file）
      required:
        type: boolean
        description: 是否必填
      options:
        type: array
        items:
          $ref: '#/schemas/FormOption'

  FormOption:
    type: object
    properties:
      label:
        type: string
        description: 选项名称
      value:
        description: 选项值

  UploadGroup:
    type: object
    properties:
      id:
        type: integer
        description: 分组ID
      name:
        type: string
        description: 分组名称
      parent_id:
        type: integer
        description: 上级分组ID
      sort:
        type: integer
        description: 排序
      store_id:
        type: integer
        description: 企业ID
      created_at:
        type: integer
        description: 创建时间
      updated_at:
        type: integer
        description: 更新时间
      children:
        type: array
        items:
          $ref: '#/schemas/UploadGroup'
        description: 子分组

  UploadFile:
    type: object
    properties:
      id:
        type: integer
        description: 文件ID
      group_id:
        type: integer
        description: 分组ID
      channel:
        type: integer
        description: 上传来源 (10后台 20客户端)
      storage:
        type: string
        description: 存储方式
      domain:
        type: string
        description: 存储域名
      file_type:
        type: integer
        description: 文件类型 (10图片 20附件 30视频)
      file_name:
        type: string
        description: 文件名称
      file_path:
        type: string
        description: 文件路径
      file_size:
        type: integer
        description: 文件大小(字节)
      file_ext:
        type: string
        description: 文件扩展名
      cover:
        type: string
        description: 文件封面
      uploader_id:
        type: integer
        description: 上传者用户ID
      store_id:
        type: integer
        description: 企业ID
      created_at:
        type: integer
        description: 创建时间
      updated_at:
        type: integer
        description: 更新时间
