/rbac/role/list:
  post:
    tags:
      - RBAC-角色管理
    summary: 获取角色列表
    description: 平台端角色列表，返回平铺结构（非树形），仅包含超管角色(is_super=1)，可按企业ID过滤
    operationId: getRoleList
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              role_name:
                type: string
                description: 角色名称
              store_id:
                type: integer
                description: 企业ID
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: object
              properties:
                errcode:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '../schemas.yaml#/schemas/RbacRole'

/rbac/role/create:
  post:
    tags:
      - RBAC-角色管理
    summary: 创建角色
    description: 平台端创建的角色均为超管角色(is_super=1)，必须指定所属企业(store_id)，每个企业仅允许存在一个超管角色
    operationId: createRole
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - role_name
              - store_id
            properties:
              role_name:
                type: string
                description: 角色名称
              parent_id:
                type: integer
                description: 父级角色ID
              sort:
                type: integer
                description: 排序
              store_id:
                type: integer
                description: 企业ID
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../schemas.yaml#/schemas/CommonResponse'

/rbac/role/update:
  post:
    tags:
      - RBAC-角色管理
    summary: 更新角色
    description: 平台端仅可更新超管角色，store_id 须与角色所属企业一致，且每个企业仅允许存在一个超管角色
    operationId: updateRole
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - role_name
            properties:
              id:
                type: integer
                description: 角色ID
              role_name:
                type: string
                description: 角色名称
              parent_id:
                type: integer
                description: 父级角色ID
              sort:
                type: integer
                description: 排序
              store_id:
                type: integer
                description: 企业ID
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../schemas.yaml#/schemas/CommonResponse'

/rbac/role/delete:
  post:
    tags:
      - RBAC-角色管理
    summary: 删除角色
    operationId: deleteRole
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - id
            properties:
              id:
                type: integer
                description: 角色ID
              store_id:
                type: integer
                description: 企业ID
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../schemas.yaml#/schemas/CommonResponse'

/rbac/role/set-menus:
  post:
    tags:
      - RBAC-角色管理
    summary: 设置角色菜单
    description: 为角色分配菜单权限
    operationId: setRoleMenus
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - role_id
              - menu_ids
            properties:
              role_id:
                type: integer
                description: 角色ID
              menu_ids:
                type: array
                items:
                  type: integer
                description: 菜单ID列表
              store_id:
                type: integer
                description: 企业ID
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../schemas.yaml#/schemas/CommonResponse'
