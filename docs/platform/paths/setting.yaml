/setting/form-configs:
  post:
    tags:
      - 设置管理
    summary: 获取设置表单配置
    description: 获取设置表单配置信息。only_platform=true 返回平台专属配置(站点/邮件/七牛/文件上传)，false 返回企业端可配置项。
    operationId: getPlatformFormConfigs
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              only_platform:
                type: boolean
                description: 是否获取平台专属配置(true平台端 false企业端)
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: object
              properties:
                errcode:
                  type: integer
                message:
                  type: string
                data:
                  type: array
                  items:
                    $ref: '../schemas.yaml#/schemas/FormGroup'

/setting/default/list:
  post:
    tags:
      - 默认设置管理
    summary: 获取默认设置列表
    operationId: getSettingDefaultList
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - page
              - limit
            properties:
              page:
                type: integer
              limit:
                type: integer
              setting_key:
                type: string
                description: 设置项标识
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: object
              properties:
                errcode:
                  type: integer
                message:
                  type: string
                data:
                  type: object
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '../schemas.yaml#/schemas/SettingDefault'
                    total:
                      type: integer

/setting/default/create:
  post:
    tags:
      - 默认设置管理
    summary: 创建默认设置
    operationId: createSettingDefault
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - setting_key
              - setting_values
            properties:
              setting_key:
                type: string
                description: 设置项标识
              setting_values:
                type: string
                description: 设置内容
              description:
                type: string
                description: 设置项描述
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../schemas.yaml#/schemas/CommonResponse'

/setting/default/update:
  post:
    tags:
      - 默认设置管理
    summary: 更新默认设置
    operationId: updateSettingDefault
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - setting_key
              - setting_values
            properties:
              id:
                type: integer
                description: 设置ID
              setting_key:
                type: string
                description: 设置项标识
              setting_values:
                type: string
                description: 设置内容
              description:
                type: string
                description: 设置项描述
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../schemas.yaml#/schemas/CommonResponse'

/setting/default/delete:
  post:
    tags:
      - 默认设置管理
    summary: 删除默认设置
    operationId: deleteSettingDefault
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - id
            properties:
              id:
                type: integer
                description: 设置ID
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: '../schemas.yaml#/schemas/CommonResponse'
